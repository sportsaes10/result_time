<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ranking en vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
  </head>

  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <header
      class="sticky top-0 z-10 bg-slate-950/80 backdrop-blur border-b border-slate-800"
    >
      <div
        class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3"
      >
        <div class="font-black text-xl flex items-center gap-2 text-nowrap">
          🏆 Ranking en vivo
        </div>
        <div class="flex gap-2">
          <a
            href="./results.html"
            class="bg-slate-100 text-slate-900 rounded-xl px-3 py-2 text-sm font-semibold text-center text-nowrap"
          >
            Registrar tiempos
          </a>
          <a
            href="./athletes.html"
            class="bg-slate-800 text-slate-100 rounded-xl px-3 py-2 text-sm font-semibold text-center text-nowrap"
          >
            Registrar atletas
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">
      <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
        <div class="flex flex-wrap items-center gap-3 mb-4">
          <div class="flex items-center gap-2 mr-4">
            <div
              class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"
            ></div>
            <span class="text-sm font-semibold text-emerald-400">LIVE</span>
          </div>

          <div class="flex flex-wrap items-center gap-2" id="filtersContainer">
            <!-- Filters injected by JS -->
          </div>

          <button
            id="refreshBtn"
            class="ml-auto bg-slate-100 text-slate-900 rounded-xl px-3 py-2 text-sm font-semibold"
          >
            Refrescar
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="text-slate-300">
              <tr
                class="[&>th]:py-2 [&>th]:px-1 sm:[&>th]:px-3 text-left border-b border-slate-800 text-xs sm:text-sm"
                id="tableHeader"
              >
                <th>Pos</th>
                <th id="th-dorsal">Dorsal</th>
                <th>Atleta</th>
                <!-- Dynamic Headers -->
                <th>Tiempo</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="rankBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>

        <div id="emptyState" class="hidden text-center py-8 text-slate-400">
          No hay resultados registrados aún
        </div>
      </div>
    </main>

    <footer class="mt-auto py-6 border-t border-slate-800 text-center">
      <div class="flex flex-col items-center justify-center gap-2">
        <p class="text-slate-500 text-sm">Desarrollado por</p>
        <img
          src="./logos/sportsaes_blanco.png"
          alt="SPORTSAES SAS"
          class="h-12 opacity-80 hover:opacity-100 transition-opacity"
        />
      </div>
      <a href="./admin.html" class="inline-block mt-4 text-[10px] text-slate-800 hover:text-slate-600 transition-colors">Admin Access</a>
    </footer>

    <script>
      // Flag global para evitar doble inicialización
      window.appInitialized = false;

      async function safeLoadRanking() {
        if (window.loadRankingFn) {
          console.log("Reloading ranking data...");
          await window.loadRankingFn();
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        if (window.appInitialized) return;
        window.appInitialized = true;

        while (!window.supabaseClient)
          await new Promise((resolve) => setTimeout(resolve, 100));
        const supabase = window.supabaseClient;

        const filtersContainer = document.getElementById("filtersContainer");
        const tableHeader = document.getElementById("tableHeader");
        const rankBody = document.getElementById("rankBody");
        const emptyState = document.getElementById("emptyState");

        let configFields = [];
        let currentEventId = null;

        // Expose loadRanking to global scope for pageshow event
        window.loadRankingFn = async () => {
          if (!currentEventId) return;

          let data, error;
          if (window.dataSource === 'local') {
            try {
              const res = await fetch(`${window.apiBaseUrl}/api/get-ranking`);
              data = await res.json();
              // Mapear datos local (aplanar si es necesario para que coincida con la estructura de Supabase)
              data = data.map(r => ({
                ...r,
                atletas: {
                  dorsal: r.dorsal,
                  nombres: r.nombres,
                  apellidos: r.apellidos,
                  genero: r.genero,
                  categoria: r.categoria,
                  club: r.club
                }
              }));
            } catch (e) { error = e; }
          } else {
            const res = await supabase
              .from("resultados")
              .select(
                "id, atleta_id, tiempo_final, tiempo_ms, timestamp_meta, created_at, atletas(dorsal, nombres, apellidos, genero, categoria, datos_adicionales)",
              )
              .eq("evento_id", currentEventId)
              .or("estado.eq.finalizado,estado.is.null")
              .order("tiempo_ms", { ascending: true, nullsFirst: false })
              .order("created_at", { ascending: false });
            data = res.data;
            error = res.error;
          }

          if (error) {
            console.error(error);
            return;
          }

          if (!data || data.length === 0) {
            emptyState.classList.remove("hidden");
            rankBody.innerHTML = "";
            return;
          }

          emptyState.classList.add("hidden");

          // --- FILTRADO DINÁMICO ---
          // Incluir filtros estándar (categoría y género) + filtros de configuración
          const standardFilterKeys = ['categoria', 'genero'];
          const textFilters = {};

          // Filtros estándar
          standardFilterKeys.forEach((key) => {
            const el = document.getElementById(`filter_${key}`);
            if (el && el.value !== "ALL") {
              textFilters[key] = el.value;
            }
          });

          // Filtros de configuración (excluyendo los ya procesados)
          const activeFilters = configFields.filter((f) => f.is_filter && !standardFilterKeys.includes(f.key));
          activeFilters.forEach((f) => {
            const el = document.getElementById(`filter_${f.key}`);
            if (el && el.value !== "ALL") {
              textFilters[f.key] = el.value;
            }
          });

          // Agrupar 'Best Time' por atleta
          const bestTimes = new Map();
          data.forEach((r) => {
            const a = r.atletas || {};
            const flatAtleta = { ...a, ...(a.datos_adicionales || {}) };

            // Check filters
            let pass = true;
            for (const [key, val] of Object.entries(textFilters)) {
              // Loose equality for numbers/strings match
              if (flatAtleta[key] != val) {
                pass = false;
                break;
              }
            }
            if (!pass) return;

            const key = r.atleta_id;
            const existing = bestTimes.get(key);
            const currentMs = r.tiempo_ms || timeToMs(r.tiempo_final);
            const existingMs = existing
              ? existing.tiempo_ms || timeToMs(existing.tiempo_final)
              : 999999999;

            if (!existing || currentMs < existingMs) {
              bestTimes.set(key, r);
            }
          });

          // Ordenar
          const rows = Array.from(bestTimes.values()).sort((a, b) => {
            const aMs = a.tiempo_ms || timeToMs(a.tiempo_final);
            const bMs = b.tiempo_ms || timeToMs(b.tiempo_final);
            return aMs - bMs;
          });

          // Render
          renderRows(rows);
        };

        function renderRows(rows) {
          rankBody.innerHTML = "";
          rows.forEach((r, idx) => {
            const a = r.atletas || {};
            const flatAtleta = { ...a, ...(a.datos_adicionales || {}) };

            const tr = document.createElement("tr");
            tr.className =
              "[&>td]:py-2 [&>td]:px-2 sm:[&>td]:px-3 border-b border-slate-800 last:border-0 hover:bg-slate-900/50 transition-colors text-xs sm:text-sm";

            // 1. Pos
            const tdPos = document.createElement("td");
            tdPos.className = "font-bold text-slate-400";
            tdPos.textContent = `#${idx + 1}`;
            tr.appendChild(tdPos);

            // 2. Dorsal
            const tdDorsal = document.createElement("td");
            tdDorsal.className = "font-semibold font-mono text-slate-300";
            tdDorsal.textContent = a.dorsal || "-";
            tr.appendChild(tdDorsal);

            // 3. Atleta
            const tdAtleta = document.createElement("td");
            const divName = document.createElement("div");
            divName.className = "font-bold text-white";
            divName.textContent = `${a.nombres || ""} ${a.apellidos || ""}`;
            const divClub = document.createElement("div");
            divClub.className = "text-xs text-slate-500";
            divClub.textContent = a.datos_adicionales?.club || "";
            tdAtleta.appendChild(divName);
            tdAtleta.appendChild(divClub);
            tr.appendChild(tdAtleta);

            // 4. Género (columna fija)
            const tdGenero = document.createElement("td");
            const spanGenero = document.createElement("span");
            spanGenero.className = "bg-slate-800 px-2 py-0.5 rounded text-xs text-slate-300 font-medium";
            spanGenero.textContent = a.genero || "-";
            tdGenero.appendChild(spanGenero);
            tr.appendChild(tdGenero);

            // 5. Categoría (columna fija)
            const tdCategoria = document.createElement("td");
            const spanCategoria = document.createElement("span");
            spanCategoria.className = "bg-slate-800 px-2 py-0.5 rounded text-xs text-slate-300 font-medium";
            spanCategoria.textContent = a.categoria || "-";
            tdCategoria.appendChild(spanCategoria);
            tr.appendChild(tdCategoria);

            // 5. Tiempo
            const tdTime = document.createElement("td");
            tdTime.className = "font-black text-xl text-emerald-400 tabular-nums font-mono";
            tdTime.textContent = r.tiempo_final || "-";
            tr.appendChild(tdTime);

            // 6. Fecha
            const tdDate = document.createElement("td");
            tdDate.className = "text-xs text-slate-500";
            tdDate.textContent = fmtDate(r.created_at);
            tr.appendChild(tdDate);

            rankBody.appendChild(tr);
          });
        }

        function fmtDate(iso) {
          return new Date(iso).toLocaleString("es-CO", { hour12: false });
        }

        function timeToMs(timeStr) {
          if (!timeStr || typeof timeStr !== "string") return 999999999;
          const trimmed = timeStr.trim();
          const parts = trimmed.split(":");
          if (parts.length !== 2 && parts.length !== 3) return 999999999;

          // Handle HH:MM:SS.CC or MM:SS.CC
          // Reusing logic ensuring checking length
          let h = 0,
            m = 0,
            s = 0,
            c = 0;
          if (parts.length === 3) {
            h = parseInt(parts[0]) || 0;
            m = parseInt(parts[1]) || 0;
            const sec = parts[2].split(".");
            s = parseInt(sec[0]) || 0;
            c = parseInt(sec[1] || 0);
            if (sec.length > 1 && sec[1].length === 1) c *= 10;
          } else {
            m = parseInt(parts[0]) || 0;
            const sec = parts[1].split(".");
            s = parseInt(sec[0]) || 0;
            c = parseInt(sec[1] || 0);
            if (sec.length > 1 && sec[1].length === 1) c *= 10;
          }

          return h * 3600000 + m * 60000 + s * 1000 + c * 10;
        }

        // --- SETUP ---
        try {
          const { data: config } = await supabase
            .from("configuracion_evento")
            .select("*")
            .limit(1)
            .single();
          if (config) {
            currentEventId = config.evento_activo_id;

            // Headers
            if (config.logo_url) {
              const headerDiv = document.querySelector("header div.max-w-5xl");
              // Remove previous if any
              const prev = headerDiv.querySelector("img");
              if (prev) prev.remove();

              const img = document.createElement("img");
              img.src = config.logo_url;
              img.className = "h-10 w-auto object-contain mr-2 rounded";
              headerDiv.insertBefore(img, headerDiv.children[0]);
            }
            if (config.nombre_evento) {
              document.title = "Ranking - " + config.nombre_evento;
              const titleDiv = document.querySelector("header div.font-black");
              if (titleDiv) titleDiv.textContent = config.nombre_evento;
            }

            // Fields
            let fields = config.configuracion_fields;
            if (typeof fields === "string") fields = JSON.parse(fields);
            configFields = Array.isArray(fields) ? fields : [];

            // Render Filters - primero cargamos datos para extraer valores únicos
            filtersContainer.innerHTML =
              '<span class="text-xs text-slate-400 uppercase font-bold mr-1">Filtrar:</span>';

            // Cargar datos para extraer categorías y géneros únicos
            let allData = [];
            if (window.dataSource === 'local') {
              try {
                const res = await fetch(`${window.apiBaseUrl}/api/get-ranking`);
                allData = await res.json();
              } catch (e) { console.error(e); }
            } else {
              const { data } = await supabase
                .from("atletas")
                .select("categoria, genero")
                .eq("evento_id", currentEventId);
              allData = data || [];
            }

            // Extraer valores únicos de categoría y género
            const uniqueCategories = [...new Set(allData.map(a => a.categoria).filter(Boolean))].sort();
            const uniqueGenders = [...new Set(allData.map(a => a.genero).filter(Boolean))].sort();

            // Filtros estándar (categoría y género) - siempre visibles si hay datos
            const standardFilters = [
              { key: 'categoria', label: 'Categoría', values: uniqueCategories },
              { key: 'genero', label: 'Género', values: uniqueGenders }
            ];

            standardFilters.forEach(sf => {
              if (sf.values.length > 0) {
                const select = document.createElement("select");
                select.id = `filter_${sf.key}`;
                select.className =
                  "bg-slate-800 text-slate-100 rounded-lg px-2 py-1 text-sm border-0 focus:ring-1 focus:ring-emerald-400";
                const defaultOpt = document.createElement("option");
                defaultOpt.value = "ALL";
                defaultOpt.textContent = `Todos (${sf.label})`;
                select.appendChild(defaultOpt);

                sf.values.forEach((val) => {
                  const opt = document.createElement("option");
                  opt.value = val;
                  opt.textContent = val;
                  select.appendChild(opt);
                });
                select.addEventListener("change", window.loadRankingFn);
                filtersContainer.appendChild(select);
              }
            });

            // Filtros adicionales de la configuración (excluyendo categoría y género ya manejados)
            configFields.forEach((f) => {
              if (f.active !== false && f.is_filter && f.type === "select" && !['categoria', 'genero'].includes(f.key)) {
                const select = document.createElement("select");
                select.id = `filter_${f.key}`;
                select.className =
                  "bg-slate-800 text-slate-100 rounded-lg px-2 py-1 text-sm border-0 focus:ring-1 focus:ring-emerald-400";
                select.innerHTML = ""; // Clear
                const defaultOpt = document.createElement("option");
                defaultOpt.value = "ALL";
                defaultOpt.textContent = `Todos (${f.label})`;
                select.appendChild(defaultOpt);

                (Array.isArray(f.options)
                  ? f.options
                  : (f.options || "").split(",")
                ).forEach((o) => {
                  const val = o.trim();
                  const opt = document.createElement("option");
                  opt.value = val;
                  opt.textContent = val;
                  select.appendChild(opt);
                });
                select.addEventListener("change", window.loadRankingFn);
                filtersContainer.appendChild(select);
              }
            });

            // Render Headers (columnas fijas simplificadas)
            let html = `<th>Pos</th>`;
            // Dorsal Logic - usar label de configuración si existe
            const dorsalField = configFields.find((f) => f.key === "dorsal");
            const dorsalLabel = dorsalField?.label || "Dorsal";
            if (dorsalField && dorsalField.active === false) {
              const style = document.createElement("style");
              style.innerHTML = `#th-dorsal, td:nth-child(2) { display: none !important; }`;
              document.head.appendChild(style);
              html += `<th id="th-dorsal" class="hidden">${dorsalLabel}</th>`;
            } else {
              html += `<th id="th-dorsal">${dorsalLabel}</th>`;
            }
            html += `<th>Atleta</th>`;
            html += `<th>Género</th>`;
            html += `<th>Categoría</th>`;
            html += `<th>Tiempo</th><th>Fecha</th>`;
            tableHeader.innerHTML = html;

            // Initial Load
            await window.loadRankingFn();
          }
        } catch (e) {
          console.error(e);
        }

        // Listeners
        document
          .getElementById("refreshBtn")
          .addEventListener("click", window.loadRankingFn);

        // Realtime
        supabase
          .channel("results-live")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "resultados" },
            async (payload) => {
              console.log("Cambio en realtime detectado (Ranking):", payload);
              if (window.loadRankingFn) await window.loadRankingFn();
            },
          )
          .subscribe();
      });

      // Detectar navegación Back/Forward (BFCache)
      window.addEventListener("pageshow", async (event) => {
        if (event.persisted) {
          await safeLoadRanking();
        }
      });
    </script>
  </body>
</html>
